# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  request_changes_workflow: true
  auto_review:
    drafts: false
    # Stacked pull requests target the branch below them, not the default branch.
    base_branches:
      - '.*'
  path_filters:
    - '!.agents/**'
    - '!.claude/**'
    - '!.cursor/**'
