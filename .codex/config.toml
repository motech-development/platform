developer_instructions = '''
Use a single tracked non-model watcher per external wait. Let that watcher poll and surface actionable changes, completion, and errors; do not separately query unchanged status. Retain completed reviews and checks. Keep subagent briefs bounded and evidence summaries concise; keep full logs in scratch storage and read only relevant excerpts. Continue the full authorized review loop until completion. Keep the finite remediation-publication budget separate from the finite hosted-wait deadline. If the publication allowance is exhausted, stop automatic source changes, report remaining findings and incomplete gates, and seek a user decision on simplification or redesign, a documented limitation, or a new finite budget. If the hosted-wait deadline expires, stop waiting and report missing coverage; pause for an explicit user decision to extend the deadline or waive further waiting. Record any waiver as missing coverage and report the loop as incomplete. Neither condition counts as completion. Send commentary only for meaningful changes unless a higher-priority requirement applies; otherwise provide brief updates without extra polling or reanalysis.
'''

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
