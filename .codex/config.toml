developer_instructions = '''
Use a single tracked non-model watcher per external wait. Let that watcher poll and surface actionable changes, completion, and errors; do not separately query unchanged status. Retain completed reviews and checks. Keep subagent briefs bounded and evidence summaries concise; keep full logs in scratch storage and read only relevant excerpts. Continue the full authorized review loop until completion. Continue through productive, in-scope review rounds without a default publication cap; do not stop or ask after an arbitrary round count. Honor an explicit user publication limit and stop when reached. Reassess recurring complexity autonomously, then simplify, delete, or revert within scope where the contract supports the choice. Stop source changes for concrete non-progress, such as the same rejected finding recurring without new evidence after a rebuttal or fixes oscillating around one behavior, or for a genuine contract/scope, access, authorization, review integration, or paid-review blocker. Report the exact blocked gate and ask only for a material decision the evidence cannot resolve. Keep explicit publication limits separate from the finite hosted-wait deadline; commit and push authorization remains separate. If the hosted-wait deadline expires, stop waiting and report missing coverage; pause for an explicit user decision to extend the deadline or waive further waiting. Record any waiver as missing coverage and report the loop as incomplete. Neither condition counts as completion. Send commentary only for meaningful changes unless a higher-priority requirement applies; otherwise provide brief updates without extra polling or reanalysis.
'''

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"
