name: Quality assurance

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-dependencies/**'
      - '.github/workflows/quality-assurance.yml'
      - '.nvmrc'
      - '.yarn/**'
      - '.yarnrc.yml'
      - 'package.json'
      - 'packages/breeze-ui/**'
      - 'tsconfig.json'
      - 'yarn.lock'
  workflow_dispatch:

jobs:
  label:
    name: Label PR

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  delivery-catalog:
    name: Validate delivery catalog

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Test planner and generator
        run: node --test .github/delivery/*.test.mjs

      - name: Check generated workflows
        run: node .github/delivery/generate.mjs --check

      - name: Test dependency maintenance policy
        run: node --test .github/renovate/*.test.mjs

  formatting:
    name: Formatting

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Check formatting
        run: yarn formatting

  lint:
    name: Lint

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Build packages
        run: yarn package

      - name: Lint code
        run: yarn lint

  type-check:
    name: Type check

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Build packages
        run: yarn package

      - name: Type check
        run: yarn typecheck

  unit-tests:
    name: Unit tests

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-dependencies

      - name: Build packages
        run: yarn package

      - name: Restore cache
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-cache-v4-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cache-

      - name: Install Playwright browsers
        run: yarn workspace @motech-development/breeze-ui playwright install --with-deps chromium

      - name: Unit test
        run: yarn workspaces foreach -Wp -j 3 run test-ci

      - name: Fix paths for SonarCloud Scan
        run: ./scripts/sonar-scanner-path-fix.sh

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  chromatic:
    name: Chromatic

    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Breeze changes
        id: breeze-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- packages/breeze-ui/)
          if [ -n "$changed_files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup dependencies
        if: steps.breeze-changes.outputs.changed == 'true'
        uses: ./.github/actions/setup-dependencies

      - name: Run Chromatic
        if: steps.breeze-changes.outputs.changed == 'true'
        uses: chromaui/action@94713c544284a14195de3b50ef24301579f1877e # v18.0.1
        with:
          workingDir: packages/breeze-ui
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: deploy
          autoAcceptChanges: main
          exitOnceUploaded: true
