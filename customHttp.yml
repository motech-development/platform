applications:
  - appRoot: applications/accounts/web
    customHeaders:
      - pattern: '/_shell.html'
        headers:
          - key: Cache-Control
            value: no-store
      - pattern: '/service-worker.js'
        headers:
          - key: Cache-Control
            value: no-store
      - pattern: '/manifest.webmanifest'
        headers:
          - key: Cache-Control
            value: no-cache
      - pattern: '**'
        headers:
          - key: X-Content-Type-Options
            value: nosniff
          - key: Referrer-Policy
            value: strict-origin-when-cross-origin
          - key: Permissions-Policy
            value: camera=(), microphone=(), geolocation=()
