<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
/>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  /* ---- 1. tokens: these become Tailwind utilities (bg-canvas, text-ink, rounded-panel …) ---- */
  @theme {
    --breakpoint-sm: 42.5625rem; /* breeze's own breakpoints */
    --breakpoint-md: 56.3125rem;
    --breakpoint-lg: 73.8125rem;

    --font-sans: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI',
      helvetica, arial, sans-serif;

    --color-brand: #007fa8;
    --color-brand-hover: #007aa3;
    --color-brand-text: #006884;
    --color-brand-soft: #e3f2f8;
    --color-on-brand: #ffffff;
    --color-canvas: #f6f9fc;
    --color-surface: #ffffff;
    --color-raised: #f6f9fc;
    --color-sunken: #eff3f8;
    --color-line: #e3e8ee;
    --color-line-strong: #cfd7e0;
    --color-ink: #161616;
    --color-ink-2: #4a4f57;
    --color-ink-3: #66707c;
    --color-pos: #127a4e;
    --color-pos-soft: #e4f1ea;
    --color-warn: #8a5a0b;
    --color-warn-soft: #fdf3dc;
    --color-danger: #b4231d;

    /* Type ramp. Sixteen ad-hoc sizes collapsed to eleven steps; nothing moves more than 2px. */
    --text-2xs: 11px;
    --text-xs: 12px;
    --text-sm: 13px;
    --text-base: 14px;
    --text-md: 15px;
    --text-lg: 17px;
    --text-xl: 20px;
    --text-2xl: 22px;
    --text-3xl: 24px;
    --text-4xl: 26px;
    --text-5xl: 32px;

    /* Spacing is Tailwind's 4px grid (--spacing 0.25rem); every gap, pad and margin snaps to it. */

    /* Fixed measures that are structure rather than spacing, named so no utility needs brackets. */
    --spacing-control: 38px; /* standard input / button row */
    --spacing-control-lg: 52px; /* the amount field */
    --spacing-chip: 34px;
    --spacing-tap: 44px; /* minimum touch target */
    --spacing-doc: 64px; /* the attachment row */
    --spacing-sheet: 610px;
    --spacing-card: 400px;

    --radius-panel: 8px;
    --radius-ctl: 6px;
    --radius-chip: 3px;
    --leading-tight: 1.1;
    --leading-snug: 1.45;
    --leading-normal: 1.5;
    --tracking-tight: -0.008em;
    --tracking-tighter: -0.012em;
    --tracking-tightest: -0.018em;
    --tracking-caps: 0.06em;
    --tracking-wide: 0.05em;
    --aspect-a4: 1/1.414;
    --aspect-photo: 3/4;
    --container-page: 1500px;
    --container-read: 54ch;
    --spacing-svh-70: 70vh;
    --container-prose: 52ch;

    --color-scrim: #0c121f;
    --animate-skel: skel 1.4s ease-in-out infinite;
    --radius-xs: 2px;
    --radius-sm: 4px;

    --shadow-panel: 0 1px 1px rgb(22 22 22/3%), 0 2px 5px rgb(22 22 22/4%);
    --shadow-over: 0 1px 2px rgb(22 22 22/6%),
      0 8px 24px -10px rgb(22 22 22/25%);
  }

  /* ---- 2. dark: utilities compile to var(--color-*), so overriding the var flips the theme ---- */
  [data-theme='dark'] {
    --color-brand-text: #33aacf; /* #007FA8 is 3.96:1 on #161616 — an AA fail */
    --color-brand-soft: #12313b;
    --color-canvas: #161616;
    --color-surface: #1f1f1f;
    --color-raised: #262626;
    --color-sunken: #262626;
    --color-line: #303030;
    --color-line-strong: #3d3d3d;
    --color-ink: #f2f2f2;
    --color-ink-2: #b4b4b4;
    --color-ink-3: #949494;
    --color-pos: #3fbf8b;
    --color-pos-soft: #16291f;
    --color-warn: #e0b341;
    --color-warn-soft: #2a2314;
    --color-danger: #f1736a;
    --shadow-panel: 0 1px 1px rgb(0 0 0/40%);
    --shadow-over: 0 1px 2px rgb(0 0 0/50%), 0 8px 24px -10px rgb(0 0 0/70%);
  }

  /* ---- 3. components: each @apply list is the future tailwind-variants recipe ---- */
  /* our dark mode is an attribute, not a class; aria-current has no built-in variant */
  @custom-variant dark (&:where([data-theme="dark"] *));
  @custom-variant current (&[aria-current="page"]);

  /* @theme shadow tokens bake their value into a utility, so these wrap the property and stay theme-reactive */
  @utility shadow-panel {
    box-shadow: var(--shadow-panel);
  }
  @utility shadow-over {
    box-shadow: var(--shadow-over);
  }
  @utility shadow-fab {
    box-shadow: 0 2px 6px -2px rgb(22 22 22/30%);
  }
  /* ---- 4. motion. Every name stands for a relationship, not a decoration: what stays put, what is
   the same thing seen larger, what moved, what arrived. The vt-* classes are markers only — no
   element is named permanently. A name is granted below, for the one transition type it belongs
   to, because an element that survives a transition has both an old and a new snapshot and an
   unconditional animation replays on every unrelated transition. That is what made the sheet
   slide out and back in each time the document opened over it. In React this is the same thing
   `default="none"` plus type-keyed props buys you. ---- */
  @keyframes skel {
    0%,
    100% {
      opacity: 1;
    }
    50% {
      opacity: 0.45;
    }
  }

  :root {
    --vt-out: 130ms;
    --vt-in: 220ms;
    --vt-move: 300ms;
    --vt-ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes vt-fade-in {
    from {
      opacity: 0;
    }
  }
  @keyframes vt-fade-out {
    to {
      opacity: 0;
    }
  }
  @keyframes vt-rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
  }
  @keyframes vt-sheet-in {
    from {
      transform: translateX(100%);
    }
  }
  @keyframes vt-sheet-out {
    to {
      transform: translateX(100%);
    }
  }
  @keyframes vt-lift-in {
    from {
      transform: translateY(100%);
    }
  }
  @keyframes vt-lift-out {
    to {
      transform: translateY(100%);
    }
  }
  @keyframes vt-pop {
    from {
      opacity: 0;
      transform: scale(0.97) translateY(-4px);
    }
  }
  @keyframes vt-toast-in {
    from {
      opacity: 0;
      transform: translateY(-8px);
    }
  }
  @keyframes vt-blur {
    30% {
      filter: blur(3px);
    }
  }

  /* the root is left live, so anything unnamed simply swaps: no frozen snapshot, no dead hover,
   and no reason to name static chrome except when the root itself is being redrawn */
  ::view-transition {
    pointer-events: none;
  }
  ::view-transition-old(root) {
    display: none;
  }
  ::view-transition-new(root) {
    animation: none;
  }

  /* --- a change of place. Only here is the page itself redrawn, so only here does the chrome need
   naming: without it, the topbar and the tab rows would fade out and in with everything else. --- */
  :root[data-vt='nav'] .vt-topbar,
  :root[data-vt='mode'] .vt-topbar {
    view-transition-name: topbar;
  }
  :root[data-vt='nav'] .vt-topnav,
  :root[data-vt='mode'] .vt-topnav {
    view-transition-name: topnav;
  }
  :root[data-vt='nav'] .vt-botnav,
  :root[data-vt='mode'] .vt-botnav {
    view-transition-name: botnav;
  }
  :root[data-vt='nav'] .vt-devbar,
  :root[data-vt='mode'] .vt-devbar {
    view-transition-name: devbar;
  }
  :root[data-vt='nav'] .vt-navmark {
    view-transition-name: navmark;
  }

  ::view-transition-group(topbar),
  ::view-transition-group(topnav),
  ::view-transition-group(botnav),
  ::view-transition-group(devbar) {
    animation: none;
    z-index: 100;
  }
  ::view-transition-old(topbar),
  ::view-transition-new(topbar),
  ::view-transition-old(topnav),
  ::view-transition-new(topnav),
  ::view-transition-old(botnav),
  ::view-transition-new(botnav),
  ::view-transition-old(devbar),
  ::view-transition-new(devbar) {
    animation: none;
  }

  :root[data-vt='nav']::view-transition-old(root),
  :root[data-vt='mode']::view-transition-old(root) {
    display: block;
    animation: vt-fade-out var(--vt-out) var(--vt-ease) both;
  }
  :root[data-vt='nav']::view-transition-new(root),
  :root[data-vt='mode']::view-transition-new(root) {
    animation: vt-rise var(--vt-in) var(--vt-ease) both;
  }

  /* "you are here" slides to its new tab; the bar itself is solid, so only the box moves */
  ::view-transition-group(navmark) {
    animation-duration: var(--vt-move);
    animation-timing-function: var(--vt-ease);
    z-index: 101;
  }
  ::view-transition-old(navmark),
  ::view-transition-new(navmark) {
    animation: none;
  }

  /* --- the sheet, and the scrim behind it --- */
  :root[data-vt='sheet'] .vt-sheet,
  :root[data-vt='toast'] .vt-sheet {
    view-transition-name: sheet;
  }
  :root[data-vt='sheet'] .vt-scrim,
  :root[data-vt='toast'] .vt-scrim {
    view-transition-name: scrim;
  }
  ::view-transition-group(sheet),
  ::view-transition-group(scrim) {
    z-index: 150;
  }
  ::view-transition-old(scrim) {
    animation: vt-fade-out var(--vt-out) var(--vt-ease) both;
  }
  ::view-transition-new(scrim) {
    animation: vt-fade-in var(--vt-in) var(--vt-ease) both;
  }
  ::view-transition-old(sheet) {
    animation: vt-sheet-out var(--vt-out) var(--vt-ease) both;
  }
  ::view-transition-new(sheet) {
    animation: vt-sheet-in var(--vt-in) var(--vt-ease) both;
  }
  @media (width < 48rem) {
    /* on a phone the sheet is docked to the bottom, so it rises */
    ::view-transition-old(sheet) {
      animation-name: vt-lift-out;
    }
    ::view-transition-new(sheet) {
      animation-name: vt-lift-in;
    }
  }

  /* --- menus grow from where they are anchored --- */
  :root[data-vt='menu'] .vt-menu {
    view-transition-name: menu;
  }
  :root[data-vt='menu'] .vt-catmenu {
    view-transition-name: catmenu;
  }
  :root[data-vt='menu'] .vt-datemenu {
    view-transition-name: datemenu;
  }
  ::view-transition-group(menu),
  ::view-transition-group(catmenu),
  ::view-transition-group(datemenu) {
    z-index: 160;
  }
  ::view-transition-old(menu),
  ::view-transition-old(catmenu),
  ::view-transition-old(datemenu) {
    animation: vt-fade-out 90ms var(--vt-ease) both;
  }
  ::view-transition-new(menu),
  ::view-transition-new(catmenu),
  ::view-transition-new(datemenu) {
    animation: vt-pop 150ms var(--vt-ease) both;
  }

  /* --- the confirmation. Saving closes the sheet and confirms in one transition, which is why the
   sheet is named for this type too: it still has to leave. --- */
  :root[data-vt='toast'] .vt-toast {
    view-transition-name: toast;
  }
  ::view-transition-group(toast) {
    z-index: 200;
  }
  ::view-transition-old(toast) {
    animation: vt-fade-out var(--vt-out) var(--vt-ease) both;
  }
  ::view-transition-new(toast) {
    animation: vt-toast-in var(--vt-in) var(--vt-ease) both;
  }

  /* --- the same file, seen larger. Nothing else is named for this type, so the sheet and the
   scrim hold perfectly still while the attachment opens over them. --- */
  :root[data-vt='doc'] .vt-doc {
    view-transition-name: doc;
  }
  ::view-transition-group(doc) {
    animation-duration: var(--vt-move);
    animation-timing-function: var(--vt-ease);
    z-index: 170;
  }
  /* the old snapshot is a 44px strip stretched to full screen, so hand over quickly and blur
   through the middle rather than holding a scaled ghost for the whole morph */
  ::view-transition-old(doc) {
    animation: vt-fade-out 120ms var(--vt-ease) both;
  }
  ::view-transition-new(doc) {
    animation: vt-fade-in 160ms var(--vt-ease) both;
  }
  ::view-transition-image-pair(doc) {
    animation: vt-blur var(--vt-move) var(--vt-ease) both;
  }

  /* --- a ledger row that survives a filter is the same row, so it moves instead of being replaced.
   Only on a filter: the same ids appear on Overview and on Money, and pairing them across a route
   change sent rows flying across the page. --- */
  :root[data-vt='list'] .vt-row {
    view-transition-name: var(--vt);
  }
  :root[data-vt='list']::view-transition-group(*) {
    animation-duration: var(--vt-move);
    animation-timing-function: var(--vt-ease);
  }

  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(*),
    ::view-transition-new(*),
    ::view-transition-group(*) {
      animation-duration: 0s !important;
      animation-delay: 0s !important;
    }
  }

  @layer base {
    * {
      @apply box-border;
    }
    body {
      @apply text-ink m-0 font-sans text-sm leading-snug;
    }
    button {
      @apply cursor-pointer border-0 bg-transparent;
      font: inherit;
      color: inherit;
    }
    a {
      @apply text-brand-text no-underline;
    }
    :focus-visible {
      @apply outline-brand rounded-chip outline-2;
      outline-offset: 2px;
    }
  }

  /* unlayered on purpose: the artifact/host skeleton sets an off-white body background,
   and an unlayered rule there would otherwise beat anything inside @layer base. */
  body {
    background: var(--color-canvas);
    min-height: 100vh;
  }

  /* the resolved theme is always on the attribute, so selects, scrollbars and carets follow it */
  :root {
    color-scheme: light;
  }
  [data-theme='dark'] {
    color-scheme: dark;
  }
</style>

<script>
  (function () {
    'use strict';

    /* ---------------- sample data (invented; shapes follow the real schema) ---------------- */
    var CO = {
      id: 'c1',
      initials: 'HP',
      name: 'Harbour & Pine Ltd',
      number: '09183422',
    };
    var COMPANIES = [
      CO,
      {
        id: 'c2',
        initials: 'WF',
        name: 'Wold Farm Joinery Ltd',
        number: '11274903',
      },
    ];
    var BALANCE = {
      balance: 24180.5,
      currency: 'GBP',
      vat: { owed: 4120.0, paid: 1860.0 },
    };
    var TODAY = new Date(
      2026,
      8,
      3,
    ); /* the prototype's fixed today, matching the sample ledger */
    var MONTHS = [
      'January',
      'February',
      'March',
      'April',
      'May',
      'June',
      'July',
      'August',
      'September',
      'October',
      'November',
      'December',
    ];
    /* Settings.yearEnd is a day and a month only; the year, the days remaining and the start of the
   financial year all follow from it, so none of them may be written into the markup. */
    var YEAR_END = { day: 31, month: 3, year: 2027 };
    function yearEndDate() {
      return new Date(YEAR_END.year, YEAR_END.month - 1, YEAR_END.day);
    }
    function yearEndLabel() {
      return (
        YEAR_END.day + ' ' + MONTHS[YEAR_END.month - 1] + ' ' + YEAR_END.year
      );
    }
    function yearStartLabel() {
      var d = yearEndDate();
      d.setDate(d.getDate() + 1);
      d.setFullYear(d.getFullYear() - 1);
      return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    }
    function daysToYearEnd() {
      return Math.round((yearEndDate() - TODAY) / 86400000);
    }
    /* ReportInput.year is an Int — the year the accounting year BEGINS. reports/get-transactions
   ranges `<year>-<month+1>-<day+1>` to `<year+1>-<month+1>-<day>` as sort-key strings, so 2026
   means 1 April 2026 to 31 March 2027. Settings.yearEnd.month is zero-based, as Luxon indexes it.
   Only completed years are offered, so the list moves with the year end and cannot be written down. */
    function reportYears() {
      var current = yearEndDate().getFullYear() - 1,
        out = [];
      for (var i = 1; i <= 3; i++) {
        var y = current - i;
        out.push({ value: y, label: y + '-' + String(y + 1).slice(-2) });
      }
      return out;
    }

    /* Settings.categories — user-defined per company, any length, each with its own vatRate.
   "Sales" is not in here: the API writes that literal on a sale, and these are expense categories.
   protect:true is not a free choice — createCompany seeds exactly these five at 0%, and
   nothing else can ever carry the flag, because categories the user adds are written protect:false. */
    var CATEGORIES = [
      { name: 'Accountancy', rate: 20 },
      { name: 'Bank charges', rate: 0 },
      { name: 'Corporation tax', rate: 0, protect: true },
      { name: 'Dividend', rate: 0, protect: true },
      { name: 'Insurance', rate: 0 },
      { name: 'Marketing', rate: 20 },
      { name: 'Materials', rate: 20 },
      { name: 'Mileage', rate: 0, protect: true },
      { name: 'Office supplies', rate: 20 },
      { name: 'Postage', rate: 0 },
      { name: 'Premises', rate: 20 },
      { name: 'Professional fees', rate: 20 },
      { name: 'Salary', rate: 0, protect: true },
      { name: 'Software', rate: 20 },
      { name: 'Subsistence', rate: 0 },

      if (S.docFull) {
        S.docFull = false;
        render('doc');
        return;
      }
      if (S.sheet || S.menu) {
        S.sheet = null;
        S.menu = null;
        render();
      }
    });
    window.addEventListener('hashchange', function () {
      var r = location.hash.replace('#/', '');
      if (!r) {
        S.route = 'overview';
      } else if (VIEWS[r] || r === 'login' || r === 'notfound') {
        S.route = r;
      } else {
        S.route = 'notfound';
      }
      S.sheet = null;
      S.menu = null;
      render();
    });

    var start = location.hash.replace('#/', '');
    if (VIEWS[start] || start === 'login' || start === 'notfound')
      S.route = start;
    else if (start) S.route = 'notfound';
    render();
  })();
</script>
