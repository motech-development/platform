interface:
  display_name: 'PR Review Loop'
  short_description: 'Loop until Codex, CodeRabbit, Sonar, and CI are clear'
  default_prompt: 'Use $pr-review-loop from a trusted copy loaded before opening any less-trusted PR checkout, following its trusted-launch procedure, with GPT-6 Luna at high effort (High) until Codex is clear, CodeRabbit approves the latest commit, Sonar has no open PR issues or unreviewed hotspots, required CI passes, and all bot review threads are resolved. Preserve the original task scope and behavior matrix across every fix and cumulative pre-push check. Collect complete exact-head terminal feedback before remediation, triage the durable behavior-theme ledger, validate a concrete delta, then run parallel native Codex and CodeRabbit reviews before publication. Use the default initial publication plus at most two automatic remediation republishes; stop for an explicit simplify, redesign, limitation, or new-budget decision when exhausted. Perform authorized reactions and resolutions plus the default evidence-backed rejection explanations for conclusively rejected CodeRabbit findings; never send other text replies without explicit authorization. Sleep based on pipeline history within a bounded hosted wait, and skip CodeRabbit if it requires credit consent, continuing the remaining loop and reporting the skipped coverage at the end without spending.'
