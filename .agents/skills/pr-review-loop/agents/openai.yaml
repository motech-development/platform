interface:
  display_name: 'PR Review Loop'
  short_description: 'Loop until Codex, CodeRabbit, Sonar, and CI are clear'
  default_prompt: 'Use $pr-review-loop from a trusted copy loaded before opening any less-trusted PR checkout, following its trusted-launch procedure, with GPT-5.6 Luna at high effort (High) until Codex is clear, CodeRabbit approves the latest commit, Sonar has no open PR issues, and required CI passes. Preserve the original task scope across every fix and cumulative pre-push check. Delegate valid in-scope fixes to an implementer at max effort while the parent owns the loop. Repeat parallel native Codex and CodeRabbit reviews until both are clear before every push, then wait for hosted feedback and repeat. Resolve handled threads, sleep based on pipeline history, and skip CodeRabbit if it requires credit consent, continuing the remaining loop and reporting the skipped coverage at the end without spending.'
