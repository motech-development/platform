service: accounts-data

provider:
  name: aws
  region: ${opt:region, 'eu-west-1'}
  runtime: nodejs24.x
  stage: ${opt:stage, 'local'}
  logRetentionInDays: 30
  stackName: ${self:custom.prefix}-data
  deploymentBucket:
    name: ${self:service}-deployment-bucket
  environment:
    SENTRY_ENVIRONMENT: ${self:provider.stage}

package:
  individually: true

plugins:
  - serverless-deployment-bucket
  - serverless-esbuild
  - serverless-prune-plugin

custom:
  prefix: accounts-${self:provider.stage}
  dataDeletionPolicy: ${self:custom.dataDeletionPolicies.${self:provider.stage}, 'Delete'}
  dataDeletionPolicies:
    develop: Retain
    production: Retain

  prune:
    automatic: true
    includeLayers: true
    number: 1

  esbuild:
    bundle: true
    external:
      - '@sentry/profiling-node'
    platform: node
    sourcemap: true
    target: node24

functions:
  ClearAttachments:
    handler: src/clear-attachments.handler
    events:
      - sqs:
          arn: !ImportValue ${self:provider.stage}-AntiVirusFailureQueueArn
          functionResponseType: ReportBatchItemFailures
    role: DataLambdaFunctionRole
    environment:
      BUCKET: !ImportValue ${self:provider.stage}-StorageUploadBucket
      SENTRY_DSN: ${env:SENTRY_DSN}
      TABLE: !Ref ApplicationTable

  PublishTransactions:
    handler: src/publish-transactions.handler
    role: PublishTransactionsLambdaFunctionRole
    timeout: 30
    events:
      - sqs:
          arn: !GetAtt PublicationQueue.Arn
          batchSize: 1
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}
      TABLE: !Ref ApplicationTable

  ProcessStream:
    handler: src/process-stream.handler
    role: ProcessStreamLambdaFunctionRole
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt ApplicationTable.StreamArn
          batchSize: 1
          startingPosition: LATEST
          maximumRetryAttempts: 4
    environment:
      ATTACHMENT_QUEUE: !ImportValue ${self:provider.stage}-DeleteFileQueueUrl
      PUBLICATION_QUEUE_ARN: !GetAtt PublicationQueue.Arn
      SCHEDULE_GROUP: !Ref ScheduledTransactionScheduleGroup
      SCHEDULER_DELIVERY_DLQ_ARN: !GetAtt SchedulerDeliveryDeadLetterQueue.Arn
      SCHEDULER_ROLE_ARN: !GetAtt SchedulerPublicationRole.Arn
      SENTRY_DSN: ${env:SENTRY_DSN}
      TABLE: !Ref ApplicationTable

  ReportSchedulingAlarm:
    handler: src/report-scheduling-alarm.handler
    role: SchedulingAlarmLambdaFunctionRole
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}

resources:
  Resources:
    ApplicationTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.dataDeletionPolicy}
      UpdateReplacePolicy: ${self:custom.dataDeletionPolicy}
      Properties:
        TableName: ${self:custom.prefix}-application
        AttributeDefinitions:
          - AttributeName: data
            AttributeType: S
          - AttributeName: id
            AttributeType: S
          - AttributeName: __typename
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
          - AttributeName: __typename
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST
        GlobalSecondaryIndexes:
          - IndexName: __typename-data-index
            KeySchema:
              - AttributeName: __typename
                KeyType: HASH
              - AttributeName: data
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    ScheduledTransactionScheduleGroup:
      Type: AWS::Scheduler::ScheduleGroup
      Properties:
        Name: ${self:custom.prefix}-scheduled-transactions

    ScheduleSynchronisationDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600
        QueueName: ${self:custom.prefix}-schedule-synchronisation-dlq

    ScheduleSynchronisationFailureBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        BucketName: !Join
          - '-'
          - - ${self:custom.prefix}
            - schedule-sync-failures
            - !Ref AWS::AccountId
        LifecycleConfiguration:
          Rules:
            - ExpirationInDays: 14
              Id: DeleteExpiredFailures
              Status: Enabled
        NotificationConfiguration:
          EventBridgeConfiguration:
            EventBridgeEnabled: true
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    ScheduleSynchronisationFailureRule:
      Type: AWS::Events::Rule
      Properties:
        EventPattern:
          source:
            - aws.s3
          detail-type:
            - Object Created
          detail:
            bucket:
              name:
                - !Ref ScheduleSynchronisationFailureBucket
        State: ENABLED
        Targets:
          - Arn: !GetAtt ScheduleSynchronisationDeadLetterQueue.Arn
            Id: ScheduleSynchronisationDeadLetterQueue

    ScheduleSynchronisationDeadLetterQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Action:
                - sqs:SendMessage
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt ScheduleSynchronisationFailureRule.Arn
              Effect: Allow
              Principal:
                Service:
                  - events.amazonaws.com
              Resource: !GetAtt ScheduleSynchronisationDeadLetterQueue.Arn
        Queues:
          - !Ref ScheduleSynchronisationDeadLetterQueue

    StreamProcessingDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600
        QueueName: ${self:custom.prefix}-stream-processing-dlq

    StreamProcessingFailureBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        BucketName: !Join
          - '-'
          - - ${self:custom.prefix}
            - stream-processing-failures
            - !Ref AWS::AccountId
        LifecycleConfiguration:
          Rules:
            - ExpirationInDays: 14
              Id: DeleteExpiredFailures
              Status: Enabled
        NotificationConfiguration:
          EventBridgeConfiguration:
            EventBridgeEnabled: true
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    StreamProcessingFailureRule:
      Type: AWS::Events::Rule
      Properties:
        EventPattern:
          source:
            - aws.s3
          detail-type:
            - Object Created
          detail:
            bucket:
              name:
                - !Ref StreamProcessingFailureBucket
        State: ENABLED
        Targets:
          - Arn: !GetAtt StreamProcessingDeadLetterQueue.Arn
            Id: StreamProcessingDeadLetterQueue

    StreamProcessingDeadLetterQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Action:
                - sqs:SendMessage
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt StreamProcessingFailureRule.Arn
              Effect: Allow
              Principal:
                Service:
                  - events.amazonaws.com
              Resource: !GetAtt StreamProcessingDeadLetterQueue.Arn
        Queues:
          - !Ref StreamProcessingDeadLetterQueue

    SchedulerDeliveryDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600
        QueueName: ${self:custom.prefix}-scheduler-delivery-dlq

    PublicationDeadLetterQueue:
      Type: AWS::SQS::Queue
      Properties:
        MessageRetentionPeriod: 1209600
        QueueName: ${self:custom.prefix}-publication-processing-dlq

    PublicationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.prefix}-publication
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt PublicationDeadLetterQueue.Arn
          maxReceiveCount: 5
        VisibilityTimeout: 180

    ProcessStreamLambdaFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.prefix}-process-stream
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:DescribeStream
                    - dynamodb:GetRecords
                    - dynamodb:GetShardIterator
                    - dynamodb:ListStreams
                  Resource:
                    - !Join
                      - ''
                      - - !GetAtt ApplicationTable.Arn
                        - '/stream/*'
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                  Resource:
                    - !GetAtt ApplicationTable.Arn
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - !ImportValue ${self:provider.stage}-DeleteFileQueueArn
                - Effect: Allow
                  Action:
                    - scheduler:CreateSchedule
                    - scheduler:DeleteSchedule
                    - scheduler:UpdateSchedule
                  Resource:
                    - !Join
                      - ''
                      - - 'arn:aws:scheduler:'
                        - !Ref AWS::Region
                        - ':'
                        - !Ref AWS::AccountId
                        - ':schedule/'
                        - !Ref ScheduledTransactionScheduleGroup
                        - '/transaction-*'
                - Effect: Allow
                  Action:
                    - iam:PassRole
                  Resource:
                    - !GetAtt SchedulerPublicationRole.Arn
                  Condition:
                    StringEquals:
                      iam:PassedToService: scheduler.amazonaws.com
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource:
                    - !GetAtt StreamProcessingFailureBucket.Arn
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - !Join
                      - ''
                      - - !GetAtt StreamProcessingFailureBucket.Arn
                        - '/*'
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - 'arn:aws:logs:*:*:*'

    PublishTransactionsLambdaFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.prefix}-publish-transactions
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                  Resource:
                    - !GetAtt ApplicationTable.Arn
                - Effect: Allow
                  Action:
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ReceiveMessage
                  Resource:
                    - !GetAtt PublicationQueue.Arn
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - 'arn:aws:logs:*:*:*'

    SchedulingAlarmLambdaFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.prefix}-scheduling-alarm
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource:
                    - 'arn:aws:logs:*:*:*'

    SchedulerPublicationRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - scheduler.amazonaws.com
              Action:
                - sts:AssumeRole
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                  aws:SourceArn: !GetAtt ScheduledTransactionScheduleGroup.Arn
        Policies:
          - PolicyName: ${self:custom.prefix}-scheduler-publication
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - !GetAtt PublicationQueue.Arn
                    - !GetAtt SchedulerDeliveryDeadLetterQueue.Arn

    ScheduleSynchronisationDeadLetterQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - !GetAtt ReportSchedulingAlarmLambdaFunction.Arn
        AlarmName: ${self:custom.prefix}-schedule-synchronisation-dlq-messages-visible
        ComparisonOperator: GreaterThanOrEqualToThreshold
        DatapointsToAlarm: 1
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ScheduleSynchronisationDeadLetterQueue.QueueName
        EvaluationPeriods: 1
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Period: 60
        Statistic: Maximum
        Threshold: 1
        TreatMissingData: notBreaching

    SchedulerDeliveryDeadLetterQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - !GetAtt ReportSchedulingAlarmLambdaFunction.Arn
        AlarmName: ${self:custom.prefix}-scheduler-delivery-dlq-messages-visible
        ComparisonOperator: GreaterThanOrEqualToThreshold
        DatapointsToAlarm: 1
        Dimensions:
          - Name: QueueName
            Value: !GetAtt SchedulerDeliveryDeadLetterQueue.QueueName
        EvaluationPeriods: 1
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Period: 60
        Statistic: Maximum
        Threshold: 1
        TreatMissingData: notBreaching

    PublicationDeadLetterQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - !GetAtt ReportSchedulingAlarmLambdaFunction.Arn
        AlarmName: ${self:custom.prefix}-publication-processing-dlq-messages-visible
        ComparisonOperator: GreaterThanOrEqualToThreshold
        DatapointsToAlarm: 1
        Dimensions:
          - Name: QueueName
            Value: !GetAtt PublicationDeadLetterQueue.QueueName
        EvaluationPeriods: 1
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Period: 60
        Statistic: Maximum
        Threshold: 1
        TreatMissingData: notBreaching

    StreamProcessingDeadLetterQueueAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - !GetAtt ReportSchedulingAlarmLambdaFunction.Arn
        AlarmName: ${self:custom.prefix}-stream-processing-dlq-messages-visible
        ComparisonOperator: GreaterThanOrEqualToThreshold
        DatapointsToAlarm: 1
        Dimensions:
          - Name: QueueName
            Value: !GetAtt StreamProcessingDeadLetterQueue.QueueName
        EvaluationPeriods: 1
        MetricName: ApproximateNumberOfMessagesVisible
        Namespace: AWS/SQS
        Period: 60
        Statistic: Maximum
        Threshold: 1
        TreatMissingData: notBreaching

    ProcessStreamIteratorAgeAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmActions:
          - !GetAtt ReportSchedulingAlarmLambdaFunction.Arn
        AlarmName: ${self:custom.prefix}-process-stream-iterator-age
        ComparisonOperator: GreaterThanOrEqualToThreshold
        DatapointsToAlarm: 1
        Dimensions:
          - Name: FunctionName
            Value: !Ref ProcessStreamLambdaFunction
        EvaluationPeriods: 1
        MetricName: IteratorAge
        Namespace: AWS/Lambda
        Period: 60
        Statistic: Maximum
        Threshold: 900000
        TreatMissingData: notBreaching

    SchedulingAlarmLambdaPermission:
      Type: AWS::Lambda::Permission
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !GetAtt ReportSchedulingAlarmLambdaFunction.Arn
        Principal: lambda.alarms.cloudwatch.amazonaws.com
        SourceAccount: !Ref AWS::AccountId
        SourceArn: !Join
          - ''
          - - 'arn:aws:cloudwatch:'
            - !Ref AWS::Region
            - ':'
            - !Ref AWS::AccountId
            - ':alarm:'
            - ${self:custom.prefix}
            - '-*'

    DataLambdaFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.prefix}-data-lambda-function-role-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:Query
                    - dynamodb:UpdateItem
                  Resource:
                    - !GetAtt ApplicationTable.Arn
                    - !Join
                      - ''
                      - - !GetAtt ApplicationTable.Arn
                        - '/index/__typename-data-index'
                - Effect: Allow
                  Action:
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ReceiveMessage
                  Resource:
                    - !ImportValue ${self:provider.stage}-AntiVirusFailureQueueArn
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                    - logs:DescribeLogStreams
                  Resource:
                    - 'arn:aws:logs:*:*:*'

  extensions:
    ProcessStreamEventSourceMappingDynamodbApplicationTable:
      Properties:
        DestinationConfig:
          OnFailure:
            Destination: !GetAtt StreamProcessingFailureBucket.Arn

  Outputs:
    AccountsApplicationTable:
      Description: Accounts application DynamoDB table
      Value: !Ref ApplicationTable
      Export:
        Name: ${self:provider.stage}-AccountsApplicationTable

    AccountsApplicationTableArn:
      Description: Accounts application DynamoDB table ARN
      Value: !GetAtt ApplicationTable.Arn
      Export:
        Name: ${self:provider.stage}-AccountsApplicationTableArn

    AccountsApplicationTableStreamArn:
      Description: Accounts application DynamoDB table stream ARN
      Value: !GetAtt ApplicationTable.StreamArn
      Export:
        Name: ${self:provider.stage}-AccountsApplicationTableStreamArn

    AccountsStreamProcessingFailureBucketArn:
      Description: Accounts stream processing failure bucket ARN
      Value: !GetAtt StreamProcessingFailureBucket.Arn
      Export:
        Name: ${self:provider.stage}-AccountsStreamProcessingFailureBucketArn
