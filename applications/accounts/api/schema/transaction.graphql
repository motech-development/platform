enum TransactionStatus {
  confirmed
  pending
}

"A company-scoped signal to refetch transactions; repeated signals are harmless."
type TransactionChange @aws_iam @aws_oidc {
  id: ID!
  owner: String!
}

type Transactions {
  id: ID!
  items: [Transaction!]!
  nextToken: String
  status: TransactionStatus!
}

type Transaction @aws_iam @aws_oidc {
  amount: Float!
  attachment: String
  category: String!
  companyId: String!
  date: AWSDateTime!
  description: String!
  id: ID!
  name: String!
  refund: Boolean!
  scheduled: Boolean!
  status: TransactionStatus!
  vat: Float!
}

input TransactionInput {
  amount: Float!
  attachment: String!
  category: String!
  companyId: String!
  date: AWSDateTime!
  description: String!
  id: ID!
  name: String!
  refund: Boolean!
  scheduled: Boolean!
  status: TransactionStatus!
  vat: Float!
}

input TransactionBeaconTransactionsItemInput {
  amount: Float
  attachment: String
  description: String
  id: ID
  name: String
}

input TransactionBeaconVatInput {
  owed: Float!
  paid: Float!
}

input TransactionBeaconInput {
  balance: Float
  vat: TransactionBeaconVatInput
}
