service: accounts-infrastructure

provider:
  name: aws
  region: ${opt:region, 'us-east-1'}
  runtime: nodejs24.x
  stage: ${opt:stage, 'local'}
  stackName: ${self:custom.prefix}-infrastructure
  deploymentBucket:
    name: ${self:service}-deployment-bucket

plugins:
  - serverless-deployment-bucket

custom:
  prefix: accounts-${self:provider.stage}
  domainName: ${env:PROD_DOMAIN}
  subDomain: accounts.${self:custom.domainName}

resources:
  Rules:
    CloudFrontLoggingRegion:
      Assertions:
        - Assert:
            Fn::Equals:
              - Ref: AWS::Region
              - us-east-1
          AssertDescription: CloudFront standard logging v2 requires us-east-1.

  Resources:
    Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.subDomain}

    BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref Bucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Principal:
                CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId
              Resource:
                - !Join
                  - ''
                  - - !GetAtt Bucket.Arn
                    - '/*'

    CloudFrontOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: !Ref Bucket

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Aliases:
            - ${self:custom.subDomain}
          ViewerCertificate:
            AcmCertificateArn: !ImportValue Certificate
            SslSupportMethod: sni-only
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultRootObject: /index.html
          Enabled: true
          HttpVersion: http2
          Origins:
            - DomainName: !GetAtt Bucket.DomainName
              Id: ${self:custom.prefix}-app
              S3OriginConfig:
                OriginAccessIdentity:
                  Fn::Join:
                    - ''
                    - - origin-access-identity/cloudfront/
                      - Ref: CloudFrontOriginAccessIdentity
          PriceClass: PriceClass_100
          DefaultCacheBehavior:
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            Compress: true
            TargetOriginId: ${self:custom.prefix}-app
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https

    CloudFrontLogBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        LifecycleConfiguration:
          Rules:
            - ExpirationInDays: 14
              Id: DeleteExpiredCloudFrontLogs
              Status: Enabled
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true

    CloudFrontLogBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref CloudFrontLogBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontLogDelivery
              Effect: Allow
              Action:
                - s3:PutObject
              Principal:
                Service: delivery.logs.amazonaws.com
              Resource:
                - !Join
                  - ''
                  - - !GetAtt CloudFrontLogBucket.Arn
                    - '/AWSLogs/'
                    - !Ref AWS::AccountId
                    - '/CloudFront/*'
              Condition:
                ArnEquals:
                  aws:SourceArn: !GetAtt CloudFrontLogDeliverySource.Arn
                StringEquals:
                  aws:SourceAccount: !Ref AWS::AccountId
                  s3:x-amz-acl: bucket-owner-full-control

    CloudFrontLogDeliverySource:
      Type: AWS::Logs::DeliverySource
      Properties:
        LogType: ACCESS_LOGS
        Name: ${self:custom.prefix}-cloudfront-logs-source
        ResourceArn: !Join
          - ''
          - - 'arn:'
            - !Ref AWS::Partition
            - ':cloudfront::'
            - !Ref AWS::AccountId
            - ':distribution/'
            - !Ref CloudFrontDistribution

    CloudFrontLogDeliveryDestination:
      Type: AWS::Logs::DeliveryDestination
      Properties:
        DeliveryDestinationType: S3
        DestinationResourceArn: !GetAtt CloudFrontLogBucket.Arn
        Name: ${self:custom.prefix}-cloudfront-logs-destination
        OutputFormat: json

    CloudFrontLogDelivery:
      Type: AWS::Logs::Delivery
      DependsOn: CloudFrontLogBucketPolicy
      Properties:
        DeliveryDestinationArn: !GetAtt CloudFrontLogDeliveryDestination.Arn
        DeliverySourceName: ${self:custom.prefix}-cloudfront-logs-source
        RecordFields:
          - date
          - time
          - timestamp(ms)
          - x-edge-location
          - cs-method
          - cs(Host)
          - cs-uri-stem
          - sc-status
          - sc-bytes
          - cs-bytes
          - time-taken
          - time-to-first-byte
          - origin-fbl
          - origin-lbl
          - x-edge-result-type
          - x-edge-response-result-type
          - x-edge-detailed-result-type
          - x-edge-request-id
          - x-host-header
          - cs-protocol
          - cs-protocol-version
          - ssl-protocol
          - ssl-cipher
          - sc-content-type
          - sc-content-len
          - c-country
          - asn
          - cache-behavior-path-pattern

    DnsRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: !ImportValue HostedZoneId
        Name: ${self:custom.subDomain}
        Type: A
        AliasTarget:
          HostedZoneId: Z2FDTNDATAQYW2
          DNSName: !GetAtt CloudFrontDistribution.DomainName
