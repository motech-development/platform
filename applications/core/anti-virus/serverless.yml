service: anti-virus

provider:
  name: aws
  region: ${opt:region, 'eu-west-1'}
  runtime: nodejs24.x
  stage: ${opt:stage, 'local'}
  stackName: ${self:custom.prefix}
  deploymentBucket:
    name: ${self:service}-deployment-bucket
  environment:
    ATTACHMENT_TABLE: !Ref AttachmentTable
    BUCKET: !Ref DefinitionsBucket
    LD_LIBRARY_PATH: /var/task:/var/lang/lib:/lib64:/usr/lib64:/opt/lib
    SENTRY_ENVIRONMENT: ${self:provider.stage}

package:
  individually: true

plugins:
  - serverless-deployment-bucket
  - serverless-step-functions
  - serverless-webpack
  - serverless-prune-plugin

custom:
  prefix: anti-virus-${self:provider.stage}

  prune:
    automatic: true
    includeLayers: true
    number: 1

  webpack:
    excludeRegex: 'node_modules/@aws-sdk'
    includeModules:
      nodeModulesRelativeDir: ../../../
    packager: yarn
    packagerOptions:
      noFrozenLockfile: true

functions:
  CleanupAttachments:
    handler: src/handlers/cleanup-attachments.handler
    role: LambdaFunctionRole
    events:
      # Reconcile abandoned attachments at the existing quarantine retention cadence.
      - schedule:
          rate: rate(1 day)
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}

  FailureNotification:
    handler: src/handlers/failure-notification.handler
    role: LambdaFunctionRole
    environment:
      QUEUE_URL: !Ref AntiVirusFailureQueue
      SENTRY_DSN: ${env:SENTRY_DSN}

  MoveFile:
    # S3 completion can take minutes; allow the AWS Lambda maximum (15 minutes).
    timeout: 900
    handler: src/handlers/move-file.handler
    role: LambdaFunctionRole
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}

  RemoveFile:
    handler: src/handlers/remove-file.handler
    role: LambdaFunctionRole
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}

  ScanFile:
    handler: src/handlers/scan-file.handler
    memorySize: 2048
    role: LambdaFunctionRole
    timeout: 300
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}

  StartScan:
    handler: src/handlers/start-scan.handler
    role: StartScanLambdaFunctionRole
    events:
      - sqs:
          arn: !GetAtt AntiVirusQueue.Arn
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}
      STATE_MACHINE_ARN: !Ref ScanUploadStateMachine

  UpdateDefinitions:
    handler: src/handlers/update-definitions.handler
    events:
      - schedule:
          rate: rate(1 day)
    memorySize: 2048
    role: LambdaFunctionRole
    timeout: 300
    environment:
      SENTRY_DSN: ${env:SENTRY_DSN}

stepFunctions:
  validate: true
  stateMachines:
    scanUpload:
      name: ${self:custom.prefix}-scan-upload
      id: ScanUploadStateMachine
      definition:
        Comment: Scan uploaded file
        StartAt: ScanFile
        States:
          ScanFile:
            Type: Task
            Resource: !GetAtt ScanFileLambdaFunction.Arn
            Next: CheckCancellation
            Catch:
              - ErrorEquals:
                  - States.ALL
                Next: FailureNotification
                ResultPath: $.error

          CheckCancellation:
            Type: Choice
            Choices:
              - Variable: $.cancelled
                IsPresent: true
                Next: Cancelled
            Default: ProcessResult

          Cancelled:
            Type: Succeed

          ProcessResult:
            Type: Choice
            Choices:
              - Variable: $.result
                BooleanEquals: true
                Next: MoveFile
            Default: FailureNotification

          MoveFile:
            Type: Task
            Resource: !GetAtt MoveFileLambdaFunction.Arn
            Retry:
              - ErrorEquals:
                  - States.ALL
            End: true

          FailureNotification:
            Type: Task
            Resource: !GetAtt FailureNotificationLambdaFunction.Arn
            Next: RemoveFile

          RemoveFile:
            Type: Task
            Resource: !GetAtt RemoveFileLambdaFunction.Arn
            End: true

resources:
  Resources:
    AttachmentTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.prefix}-attachments
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: path
            AttributeType: S
          - AttributeName: state
            AttributeType: S
          - AttributeName: expiresAt
            AttributeType: N
        KeySchema:
          - AttributeName: path
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: PendingExpiry
            KeySchema:
              - AttributeName: state
                KeyType: HASH
              - AttributeName: expiresAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    AntiVirusFailureQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.prefix}-failure-queue

    AntiVirusQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.prefix}-queue

    DefinitionsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.prefix}-definitions

    LambdaFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.prefix}-lambda-function-role-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:DeleteObject
                    - s3:GetObject
                    - S3:GetObjectTagging
                    - s3:PutObject
                    - S3:PutObjectTagging
                  Resource:
                    - 'arn:aws:s3:::*'
                - Effect: Allow
                  Action:
                    - s3:AbortMultipartUpload
                  Resource:
                    - arn:aws:s3:::accounts-${self:provider.stage}-downloads/*
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource:
                    - arn:aws:s3:::accounts-${self:provider.stage}-downloads
                    - arn:aws:s3:::accounts-${self:provider.stage}-uploads
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource:
                    - !GetAtt AttachmentTable.Arn
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt AttachmentTable.Arn
                    - !Join
                      - ''
                      - - !GetAtt AttachmentTable.Arn
                        - '/index/PendingExpiry'
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - !GetAtt AntiVirusFailureQueue.Arn
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                    - logs:DescribeLogStreams
                  Resource:
                    - 'arn:aws:logs:*:*:*'

    StartScanLambdaFunctionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service:
                  - lambda.amazonaws.com
              Action:
                - sts:AssumeRole
        Policies:
          - PolicyName: ${self:custom.prefix}-start-scan-lambda-function-role-policy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - states:StartExecution
                  Resource:
                    - !Ref ScanUploadStateMachine
                    - !Join
                      - ''
                      - - !Ref ScanUploadStateMachine
                        - '*'
                - Effect: Allow
                  Action:
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                    - sqs:ReceiveMessage
                  Resource:
                    - !GetAtt AntiVirusQueue.Arn
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                    - logs:DescribeLogStreams
                  Resource:
                    - 'arn:aws:logs:*:*:*'
  Outputs:
    AttachmentTable:
      Value: !Ref AttachmentTable
      Export:
        Name: ${self:provider.stage}-AttachmentTable

    AttachmentTableArn:
      Value: !GetAtt AttachmentTable.Arn
      Export:
        Name: ${self:provider.stage}-AttachmentTableArn

    AntiVirusFailureQueueArn:
      Description: Anti Virus failure queue ARN
      Value: !GetAtt AntiVirusFailureQueue.Arn
      Export:
        Name: ${self:provider.stage}-AntiVirusFailureQueueArn

    AntiVirusQueueArn:
      Description: Anti Virus queue ARN
      Value: !GetAtt AntiVirusQueue.Arn
      Export:
        Name: ${self:provider.stage}-AntiVirusQueueArn

    AntiVirusQueueUrl:
      Description: Anti Virus queue URL
      Value: !Ref AntiVirusQueue
      Export:
        Name: ${self:provider.stage}-AntiVirusQueueUrl
