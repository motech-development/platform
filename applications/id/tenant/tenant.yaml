pages:
  - name: login
    html: ../client/build/login/index.html
    enabled: true
  - name: password_reset
    html: ../client/build/lo/reset/index.html
    enabled: true
resourceServers:
  - name: Accounts API
    identifier: accounts-api
    allow_offline_access: true
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    token_lifetime: 86400
    token_lifetime_for_web: 7200
clients:
  - name: Accounts
    allowed_clients: []
    allowed_logout_urls:
      - https://accounts.motechdevelopment.co.uk
      - http://localhost:3000
      - http://127.0.0.1:3000
    app_type: spa
    callbacks:
      - https://accounts.motechdevelopment.co.uk
      - http://localhost:3000
      - http://127.0.0.1:3000
    client_aliases: []
    cross_origin_auth: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - implicit
      - refresh_token
      - password
      - http://auth0.com/oauth/grant-type/password-realm
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    native_social_login:
      apple:
        enabled: false
      facebook:
        enabled: false
    oidc_conformant: true
    refresh_token:
      leeway: 4
      token_lifetime: 5
      expiration_type: expiring
      idle_token_lifetime: 4
      infinite_idle_token_lifetime: true
      infinite_token_lifetime: false
      rotation_type: rotating
    sso_disabled: false
    token_endpoint_auth_method: none
    web_origins:
      - https://accounts.motechdevelopment.co.uk
      - http://localhost:3000
      - http://127.0.0.1:3000
  - name: Default App
    callbacks: []
    cross_origin_auth: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - implicit
      - refresh_token
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    oidc_conformant: true
    refresh_token:
      expiration_type: non-expiring
      idle_token_lifetime: 1296000
      infinite_idle_token_lifetime: true
      infinite_token_lifetime: true
      leeway: 0
      token_lifetime: 2592000
      rotation_type: non-rotating
    sso_disabled: false
  - name: auth0-deploy-cli-extension
    allowed_clients: []
    app_type: non_interactive
    callbacks: []
    client_aliases: []
    cross_origin_auth: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - implicit
      - refresh_token
      - client_credentials
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 36000
      secret_encoded: false
    native_social_login:
      apple:
        enabled: false
      facebook:
        enabled: false
    oidc_conformant: true
    refresh_token:
      rotation_type: non-rotating
      expiration_type: non-expiring
    sso_disabled: false
    token_endpoint_auth_method: none
  - name: Login Actions
    app_type: non_interactive
    grant_types:
      - client_credentials
    is_first_party: true
    oidc_conformant: true
databases:
  - name: Username-Password-Authentication
    strategy: auth0
    enabled_clients:
      - Accounts
      - auth0-deploy-cli-extension
      - Default App
    is_domain_connection: false
    options:
      mfa:
        active: true
        return_enroll_settings: true
      import_mode: false
      passwordPolicy: good
      password_history:
        size: 5
        enable: false
      strategy_version: 2
      requires_username: false
      password_dictionary:
        enable: false
        dictionary: []
      brute_force_protection: true
      password_no_personal_info:
        enable: false
      password_complexity_options:
        min_length: 8
      enabledDatabaseCustomization: false
    realms:
      - Username-Password-Authentication
connections:
  - name: google-oauth2
    strategy: google-oauth2
    enabled_clients:
      - Accounts
      - auth0-deploy-cli-extension
      - Default App
    is_domain_connection: false
    options:
      email: true
      scope:
        - email
        - profile
      profile: true
tenant:
  default_audience: ''
  default_directory: Username-Password-Authentication
  enabled_locales:
    - en
  flags:
    disable_clickjack_protection_headers: false
  friendly_name: Motech Development
  picture_url: ''
  support_email: info@motechdevelopment.co.uk
  support_url: https://motechdevelopment.co.uk/support
  universal_login:
    colors:
      page_background: '#161616'
      primary: '#007fa8'
    passwordless:
      allow_magiclink_verify_without_session: true
emailProvider:
  name: ses
  credentials:
    accessKeyId: '##AUTH0_SES_ACCESS_KEY_ID##'
    secretAccessKey: '##AUTH0_SES_ACCESS_SECRET_KEY##'
    region: '##AUTH0_SES_REGION##'
  default_from_address: no-reply@motechdevelopment.co.uk
  enabled: true
emailTemplates:
  - template: blocked_account
    body: ../emails/build/blocked_account.html
    enabled: true
    from: ''
    subject: ''
    syntax: liquid
    urlLifetimeInSeconds: 432000
  - template: reset_email
    body: ../emails/build/reset_email.html
    enabled: true
    from: ''
    subject: ''
    syntax: liquid
    urlLifetimeInSeconds: 432000
  - template: stolen_credentials
    body: ../emails/build/stolen_credentials.html
    enabled: true
    from: ''
    subject: ''
    syntax: liquid
  - template: verify_email
    body: ../emails/build/verify_email.html
    enabled: true
    from: ''
    subject: ''
    syntax: liquid
    urlLifetimeInSeconds: 432000
clientGrants:
  - client_id: Login Actions
    audience: https://##AUTH0_DOMAIN##/api/v2/
    scope:
      - update:users
guardianFactors:
  - name: duo
    enabled: false
  - name: email
    enabled: false
  - name: otp
    enabled: false
  - name: push-notification
    enabled: false
  - name: recovery-code
    enabled: false
  - name: sms
    enabled: false
  - name: webauthn-platform
    enabled: false
  - name: webauthn-roaming
    enabled: false
guardianFactorProviders: []
guardianFactorTemplates: []
guardianPolicies:
  policies: []
guardianPhoneFactorSelectedProvider:
  provider: auth0
guardianPhoneFactorMessageTypes:
  message_types: []
roles: []
branding:
  colors:
    page_background: '#161616'
    primary: '#007fa8'
  logo_url: ''
  templates: []
prompts:
  customText: {}
  universal_login_experience: classic
actions:
  - name: Force email verification
    code: ./src/actions/force-email-verification.js
    runtime: node22
    dependencies:
      - name: auth0
        version: 7.7.0
    secrets:
      - name: CLIENT_ID
        value: '##AUTH0_ACTIONS_CLIENT_ID##'
      - name: CLIENT_SECRET
        value: '##AUTH0_ACTIONS_CLIENT_SECRET##'
      - name: DOMAIN
        value: '##AUTH0_DOMAIN##'
    deployed: true
    supported_triggers:
      - id: post-login
        version: v3
  - name: Set email verification sent date
    code: ./src/actions/set-email-verification-sent-date.js
    runtime: node22
    dependencies: []
    secrets: []
    deployed: true
    supported_triggers:
      - id: pre-user-registration
        version: v2
  - name: Set owner ID
    code: ./src/actions/set-owner-id.js
    runtime: node22
    dependencies: []
    secrets: []
    deployed: true
    supported_triggers:
      - id: post-login
        version: v3
triggers:
  post-login:
    - action_name: Force email verification
      display_name: Force email verification
    - action_name: Set owner ID
      display_name: Set owner ID
  pre-user-registration:
    - action_name: Set email verification sent date
      display_name: Set email verification sent date
organizations: []
themes: []
